id = "esp32"
version = "1"
description = "Classic ESP32 · ESP-IDF 5.5.6 · Xtensa GCC 14.2"
boards = ["esp32"]
shared_components = ["cmake", "ninja", "python", "xtensa-esp-elf", "esp-idf-python", "esp-rom-elfs"]
path = ["{python}/bin", "{xtensa-esp-elf}/bin", "{cmake}/bin", "{ninja}"]
configure = ["-G", "Ninja", "-DIDF_TARGET=esp32", "-DPYTHON={python}/bin/python3", "-DCCACHE_ENABLE=OFF", "-DPYTHON_DEPS_CHECKED=1", "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"]
checks = [["{python}/bin/python3", "{esp-idf}/tools/check_python_dependencies.py", "-r", "{esp-idf}/tools/requirements/requirements.core.txt"]]
outputs = ["*.elf", "*.bin", "bootloader/*.bin", "partition_table/*.bin"]
[env]
IDF_PATH = "{esp-idf}"
ESP_ROM_ELF_DIR = "{esp-rom-elfs}"
IDF_COMPONENT_MANAGER = "0"
IDF_PYTHON_CHECK_CONSTRAINTS = "0"
PYTHONPATH = "{esp-idf-python}"
PYTHONNOUSERSITE = "1"
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUTF8 = "1"
[hosts.windows-x64]
checks = [["{python}/python.exe", "{esp-idf}/tools/check_python_dependencies.py", "-r", "{esp-idf}/tools/requirements/requirements.core.txt"]]
path = ["{python}", "{xtensa-esp-elf}/bin", "{cmake}/bin", "{ninja}"]
configure = ["-DPYTHON={python}/python.exe", "-DCMAKE_MAKE_PROGRAM={ninja}/ninja.exe"]
[hosts.macos-arm64]
path = ["{python}/bin", "{xtensa-esp-elf}/bin", "{cmake}/CMake.app/Contents/bin", "{ninja}"]
[hosts.macos-x64]
path = ["{python}/bin", "{xtensa-esp-elf}/bin", "{cmake}/CMake.app/Contents/bin", "{ninja}"]
[[components]]
name = "esp-idf"
version = "5.5.6"
license = "Apache-2.0 AND LicenseRef-ESP-IDF-Third-Party"

