git = "https://github.com/espressif/esp-idf.git"
ref = "v5.5.6"
commit = "880a203ae603d08a94d06aa01e0d6761958e5e9e"
submodules = ["components/bt/controller/lib_esp32", "components/bootloader/subproject/components/micro-ecc/micro-ecc", "components/spiffs/spiffs", "components/json/cJSON", "components/mbedtls/mbedtls", "components/lwip/lwip", "components/mqtt/esp-mqtt", "components/protobuf-c/protobuf-c", "components/unity/unity", "components/bt/host/nimble/nimble", "components/esp_wifi/lib", "components/cmock/CMock", "components/esp_phy/lib", "components/heap/tlsf", "components/esp_coex/lib", "components/bt/esp_ble_mesh/lib/lib"]

