# Raspberry Pi RP2040 with Pico SDK, bare-metal C/C++.
#
# Every source is pinned twice: by the vendor checksum (sha256 of the
# download, or the git commit) and by the digest of the resulting package.

id = "rp2040"
version = "1"
description = "Raspberry Pi RP2040 · Pico SDK 2.3.1 · ARM GCC 14.2"
boards = ["pico", "pico_w"]

path = ["{python}/bin", "{arm-gcc}/bin", "{cmake}/bin", "{ninja}"]

configure = [
    "-G", "Ninja",
    "-DPICO_BOARD={board}",
    "-DPICO_TOOLCHAIN_PATH={arm-gcc}",
    "-Dpioasm_DIR={pioasm}/pioasm",
    "-Dpicotool_DIR={picotool}/picotool",
    "-DPython3_ROOT_DIR={python}",
    "-DPICO_SDK_FETCH_FROM_GIT=OFF",
    "-DFETCHCONTENT_FULLY_DISCONNECTED=ON",
    "-DCMAKE_FIND_USE_CMAKE_SYSTEM_PATH=OFF",
    "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
]

outputs = ["*.uf2", "*.elf", "*.bin", "*.hex"]

[env]
PICO_SDK_PATH = "{pico-sdk}"
PYTHONDONTWRITEBYTECODE = "1"

[hosts.windows-x64]
path = ["{python}", "{arm-gcc}/bin", "{cmake}/bin", "{ninja}"]
configure = [
    "-DPython3_EXECUTABLE={python}/python.exe",
    "-DCMAKE_MAKE_PROGRAM={ninja}/ninja.exe",
]
[hosts.windows-x64.env]
PYTHONNOUSERSITE = "1"
PYTHONUTF8 = "1"

[hosts.macos-arm64]
path = ["{python}/bin", "{arm-gcc}/bin", "{cmake}/CMake.app/Contents/bin", "{ninja}"]
configure = ["-DPython3_EXECUTABLE={python}/bin/python3", "-DCMAKE_MAKE_PROGRAM={ninja}/ninja"]
[hosts.macos-arm64.env]
PYTHONNOUSERSITE = "1"
PYTHONUTF8 = "1"

[hosts.macos-x64]
path = ["{python}/bin", "{arm-gcc}/bin", "{cmake}/CMake.app/Contents/bin", "{ninja}"]
configure = ["-DPython3_EXECUTABLE={python}/bin/python3", "-DCMAKE_MAKE_PROGRAM={ninja}/ninja"]
[hosts.macos-x64.env]
PYTHONNOUSERSITE = "1"
PYTHONUTF8 = "1"


