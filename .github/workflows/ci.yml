name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-rp2040:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify native vendor packages and Mach-O dependencies
        run: go test -v ./internal/fetch -run '^TestPrepareMacOSPackages/${{ matrix.platform }}/' -count=1 -timeout 45m
        env:
          SLEPOK_MACOS_PACKAGES_OUT: ${{ runner.temp }}/macos-packages
      - name: Parse RP2040 OpenOCD scripts without accessing USB
        run: go test -v ./internal/fetch -run '^TestRealOpenOCDPackages/${{ matrix.platform }}$' -count=1
        env:
          SLEPOK_OPENOCD_PACKAGES: ${{ runner.temp }}/macos-packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digests-${{ matrix.platform }}
          path: ${{ runner.temp }}/macos-packages/macos-digests.json
      - run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/slepok" ./cmd/slepok
      - name: Native RP2040 build, pack, restore and compare UF2
        run: bash scripts/macos_smoke.sh "$RUNNER_TEMP/slepok"
        env:
          SLEPOK_SMOKE_DOWNLOADS: ${{ runner.temp }}/macos-packages/downloads

  macos-core:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./internal/process ./internal/filelock ./internal/safepath ./internal/runner ./internal/pkgtar
      - run: go test ./cmd/slepok -run '^TestFlashDryRun'
      - run: go test ./internal/store -run '^(TestArchive|TestContainer|TestDefaultRootWithoutOverride|TestRelativeStoreRoot)'
      - run: go test ./internal/snapshot -run '^TestForeignArchiveSurvivesUnpackAndRepack$'
      - run: go test ./internal/fetch -run '^(TestPortable|TestWindowsGitLayout|TestProgress|TestInteractiveProgress|TestRedirectedProgress)'
      - run: go build -trimpath -o slepok ./cmd/slepok

  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./internal/process ./internal/filelock ./internal/safepath ./internal/runner
      - run: go test ./cmd/slepok -run '^TestFlashDryRun'
      - name: Verify native OpenOCD and RP2040 scripts without accessing USB
        run: go test -v ./internal/fetch -run '^TestRealOpenOCDPackages/windows-x64$' -count=1
        env:
          SLEPOK_OPENOCD_PACKAGES: ${{ runner.temp }}/openocd-packages
      - run: go test ./internal/pkgtar -run '^TestPortable'
      - run: go test ./internal/store -run '^(TestArchive|TestContainer|TestDefaultRootWithoutOverride|TestRelativeStoreRoot)'
      - run: go test ./internal/snapshot -run '^TestForeignArchiveSurvivesUnpackAndRepack$'
      - run: go test ./internal/fetch -run '^(TestPortable|TestWindowsGitLayout|TestProgress|TestInteractiveProgress|TestRedirectedProgress)'
      - run: go build -trimpath -o slepok.exe ./cmd/slepok

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
        env:
          SLEPOK_REQUIRE_FILESYSTEM_TESTS: "1"
          SLEPOK_REQUIRE_NETWORK_ISOLATION: "1"
      - run: go vet ./...

  rp2040-offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update
      - run: sudo apt-get install -y clangd-14
      - name: Verify native OpenOCD and RP2040 scripts without accessing USB
        run: go test -v ./internal/fetch -run '^TestRealOpenOCDPackages/linux-x64$' -count=1
        env:
          SLEPOK_OPENOCD_PACKAGES: ${{ runner.temp }}/openocd-packages
      - run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/slepok" ./cmd/slepok
      - run: bash scripts/offline_smoke.sh "$RUNNER_TEMP/slepok"
        env:
          SLEPOK_CLANGD: clangd-14
